    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --sidebar-bg: #111820;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: #111820;
            color: var(--text-main);
            height: 100dvh; /* استخدام القياس الديناميكي الدقيق للموبايل */
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .main-player {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1920');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .overlay-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 2;
        }

        .glass-panel {
            position: relative;
            z-index: 3;
            background: rgba(15, 23, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .player-info h3 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: 700;
        }

        .player-info .episode-name {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: normal;
            display: none;
            line-height: 1.4;
        }

        .player-info p.status-text {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .btn-control {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        .btn-control:active { transform: scale(0.9); }

        .btn-play-pause {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            color: #000;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .btn-play-pause:active { transform: scale(0.95); }

        #errorMsg { color: #ff4d4d; margin-top: 15px; display: none; font-weight: bold; font-size: 0.9rem; }

        .mobile-menu-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 2rem;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .top-actions {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn-top {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            font-size: 1.4rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s;
            position: relative;
        }
        .btn-top:active { transform: scale(0.9); }
        .btn-stop { color: #ff4d4d; }
        .btn-top.active-sleep { color: #000; background: var(--primary); box-shadow: 0 0 15px var(--primary); }

        .sleep-timer-container {
            position: relative;
        }

        .sleep-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4d4d;
            color: white;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 3px 6px;
            border-radius: 50%;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
        }

        .sleep-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background: rgba(15, 23, 30, 0.95);
            border: 1px solid var(--primary);
            border-radius: 12px;
            width: 150px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .sleep-menu.show { display: flex; }
        .sleep-menu div {
            padding: 12px;
            text-align: center;
            color: white;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1rem;
            transition: background 0.2s;
        }
        .sleep-menu div:hover { background: rgba(0, 242, 254, 0.2); }
        .sleep-menu div:last-child { border-bottom: none; }

        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 999;
            transition: left 0.3s ease-in-out;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
        }
        .sidebar.show { left: 0; }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .close-sidebar {
            position: absolute;
            left: 15px;
            top: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
        }

        .dropdown-container {
            padding: 30px 15px 20px 15px;
            background-color: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        .dropdown-label {
            display: block;
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .category-dropdown {
            width: 100%;
            padding: 14px 15px 14px 40px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1));
            color: var(--primary);
            border: 1.5px solid var(--primary);
            border-radius: 12px;
            font-size: 1.2rem;
            font-family: 'Tajawal', sans-serif;
            font-weight: 900;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f2fe' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 15px center; 
            background-size: 1.2em;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            transition: all 0.3s;
        }

        .category-dropdown:focus {
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            background: rgba(0, 242, 254, 0.15);
        }

        .category-dropdown option { 
            background-color: var(--sidebar-bg); 
            color: #fff;
        }

        .stations-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .stations-container::-webkit-scrollbar { width: 4px; }
        .stations-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .station-card {
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .station-card.playing { border: 1px solid var(--primary); background: rgba(0, 242, 254, 0.1); }
        .station-card.playing .play-icon { color: var(--primary); }
        .station-card h3 { font-size: 1rem; font-weight: normal; }

        /* رسالة التنبيه (Toast) */
        .toast-msg {
            visibility: hidden;
            min-width: 250px;
            background: rgba(15, 23, 30, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 15px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.95rem;
            font-weight: bold;
            border: 1px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        .toast-msg.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

    </style>
</head>
<body>

    <script src="podcasts.js"></script>
    <script src="boti.js"></script>
    <script src="quran.js"></script>

    <button class="mobile-menu-btn" onclick="openSidebar()">
        <i class="fa-solid fa-bars-staggered"></i>
    </button>

    <div class="top-actions">
        <button class="btn-top btn-stop" onclick="stopRadio()" title="إيقاف تام للمحطة لتوفير البيانات">
            <i class="fas fa-power-off"></i>
        </button>
        
        <button class="btn-top" onclick="minimizePlayer()" title="تشغيل في الخلفية">
            <i class="fas fa-window-minimize"></i>
        </button>

        <div class="sleep-timer-container">
            <button class="btn-top" onclick="toggleSleepMenu()" title="مؤقت النوم" id="sleepBtn">
                <i class="fas fa-stopwatch"></i>
                <span id="sleepBadge" class="sleep-badge"></span>
            </button>
            <div class="sleep-menu" id="sleepMenu">
                <div onclick="setSleepTimer(0)">إيقاف المؤقت</div>
                <div onclick="setSleepTimer(30)">30 دقيقة</div>
                <div onclick="setSleepTimer(60)">ساعة</div>
                <div onclick="setSleepTimer(90)">ساعة ونصف</div>
                <div onclick="setSleepTimer(120)">ساعتين</div>
                <div onclick="setSleepTimer(150)">ساعتين ونصف</div>
                <div onclick="setSleepTimer(180)">3 ساعات</div>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="dropdown-container">
            <button class="close-sidebar" onclick="closeSidebar()">
                <i class="fas fa-times"></i>
            </button>
            <label class="dropdown-label"><i class="fas fa-list"></i> اختر القسم الرئيسي:</label>
            <select id="categorySelect" class="category-dropdown" onchange="handleCategoryChange()">
            </select>
        </div>
        <div class="stations-container" id="stationsContainer"></div>
    </aside>

    <main class="main-player" id="mainBg">
        <div class="overlay-bg"></div>
        
        <div class="glass-panel" id="glassPanel">
            <div class="player-info">
                <h3 id="mainStationName">Esma3 Fm</h3>
                <p id="episodeName" class="episode-name"></p>
                <p id="mainStatusText" class="status-text">اختر إذاعة للبدء</p>
                <p id="errorMsg">الإذاعة لا تستجيب، تأكد من اتصالك</p>
            </div>

            <div class="main-controls">
                <button class="btn-control" onclick="toggleMute()" title="كتم الصوت">
                    <i id="muteIcon" class="fas fa-volume-up"></i>
                </button>

                <button class="btn-control" onclick="onNextButtonClicked()" title="المحطة/الحلقة القادمة">
                    <i class="fas fa-forward-step"></i>
                </button>

                <button class="btn-play-pause" id="playPauseBtn" onclick="togglePlay()">
                    <i id="playIcon" class="fas fa-play"></i>
                </button>

                <button class="btn-control" onclick="onPrevButtonClicked()" title="المحطة/الحلقة السابقة">
                    <i class="fas fa-backward-step"></i>
                </button>

                <button class="btn-control" onclick="toggleFullScreen()" title="ملء الشاشة">
                    <i id="expandIcon" class="fas fa-expand"></i>
                </button>
            </div>
        </div>

        <audio id="audioPlayer" preload="none" playsinline></audio>
    </main>

    <div id="toastMessage" class="toast-msg"></div>

        function updateMediaSessionMetadata(title, artist = 'Esma3 Fm') {
            if ('mediaSession' in navigator) {

                    artist: artist,
                    album: 'البث المباشر',
                    artwork: [

        function loadCategory(categoryName) {
            currentCategory = categoryName;

            stationsContainer.innerHTML = '';

            const stations = radioData[categoryName];
            stations.forEach((station, index) => {
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `<h3>${station.name}</h3> <i class="fas fa-play play-icon"></i>`;
                card.onclick = () => {
                    currentStationIndex = index;
                    playStation(station, card);
                };
                stationsContainer.appendChild(card);

       function playStation(station, cardElement, specificEpisode = null) {
            let checkUrl = station.url;
            let tempEpisode = specificEpisode;
            
            // التحقق من البودكاست
            if (station.name === "رحلة في الذاكرة" && !tempEpisode && typeof memoryJourneyEpisodes !== 'undefined') checkUrl = memoryJourneyEpisodes[0].url; 
            else if (station.name === "سورة الكهف" && !tempEpisode && typeof quranKahfEpisodes !== 'undefined') checkUrl = quranKahfEpisodes[0].url; 
            else if (station.name === "الدحيح" && !tempEpisode && typeof daheehEpisodes !== 'undefined') checkUrl = daheehEpisodes[0].url; 
            else if (station.name === "الشيخ محمد سعيد البوطي" && !tempEpisode && typeof boutiEpisodes !== 'undefined') checkUrl = boutiEpisodes[0].url; 
            else if (station.name === "هيثم الدخين" && !tempEpisode && typeof quranHaithamEpisodes !== 'undefined') checkUrl = quranHaithamEpisodes[0].url;
            else if (station.name === "رعد الكردي" && !tempEpisode && typeof quranRaadEpisodes !== 'undefined') checkUrl = quranRaadEpisodes[0].url;

            if (tempEpisode) checkUrl = tempEpisode.url;

            if (isPageTainted && !window.isRecoveringState) {
                localStorage.setItem('esma3_mob_cat', currentCategory);
                localStorage.setItem('esma3_mob_idx', currentStationIndex);
                localStorage.setItem('esma3_mob_hist', JSON.stringify(podcastHistory));
                localStorage.setItem('esma3_mob_hist_idx', currentPodcastHistoryIndex);
                if (tempEpisode) localStorage.setItem('esma3_mob_ep', JSON.stringify(tempEpisode));
                else localStorage.removeItem('esma3_mob_ep');
                localStorage.setItem('esma3_mob_triggerPlay', '1');
                window.location.reload();
                return;
            }

            window.isRecoveringState = false;

            if (checkUrl && checkUrl.startsWith('http://')) {
                isPageTainted = true;
            }

            errorMsg.style.display = 'none';
            mainStatusText.textContent = "جاري الاتصال...";
            
            let targetUrl = station.url;

            // ---- منطق التشغيل العشوائي للبودكاست ----
            if (station.name === "رحلة في الذاكرة" || station.name === "سورة الكهف" || station.name === "الدحيح" || station.name === "الشيخ محمد سعيد البوطي" || station.name === "هيثم الدخين" || station.name === "رعد الكردي") {
                
                let activeEpisodesList = station.name === "رحلة في الذاكرة" ? memoryJourneyEpisodes : 
                                         (station.name === "الدحيح" ? daheehEpisodes : 
                                         (station.name === "الشيخ محمد سعيد البوطي" ? boutiEpisodes : 
                                         (station.name === "هيثم الدخين" ? quranHaithamEpisodes : 
                                         (station.name === "رعد الكردي" ? quranRaadEpisodes : quranKahfEpisodes))));

                if (specificEpisode) {
                    targetUrl = specificEpisode.url;
                    episodeNameEl.textContent = specificEpisode.name;
                    episodeNameEl.style.display = 'block';
                    isPodcastPlaying = true;
                } else if (typeof activeEpisodesList !== 'undefined' && activeEpisodesList.length > 0) {
                    const randomEp = activeEpisodesList[Math.floor(Math.random() * activeEpisodesList.length)];
                    targetUrl = randomEp.url;
                    episodeNameEl.textContent = randomEp.name;
                    episodeNameEl.style.display = 'block';
                    isPodcastPlaying = true;
                    
                    podcastHistory = [randomEp];
                    currentPodcastHistoryIndex = 0;
                } else {
                    handleError();
                    return;
                }
            } else {
                episodeNameEl.style.display = 'none';
                isPodcastPlaying = false;
            }

            mainStationName.textContent = station.name;

            document.querySelectorAll('.station-card').forEach(c => {
                c.classList.remove('playing');
                c.querySelector('.play-icon').className = 'fas fa-play play-icon';
            });
            
            if (cardElement) {
                cardElement.classList.add('playing');
                cardElement.querySelector('.play-icon').className = 'fas fa-music play-icon'; 
                currentPlayingCard = cardElement;
            }
            
            playIcon.className = 'fas fa-spinner fa-spin'; 
            closeSidebar();

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            if (targetUrl && (targetUrl.includes('.m3u8') || targetUrl.includes('.ts')) && Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsInstance.loadSource(targetUrl);
                hlsInstance.attachMedia(audioPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    audioPlayer.play().then(onPlaySuccess).catch(handleError);
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) { 
                     if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        else handleError();
                    }
                });
            } else if (targetUrl) {
                audioPlayer.src = targetUrl;
                audioPlayer.play().then(onPlaySuccess).catch(handleError);
            }
        }

        function onPlaySuccess() {
            playIcon.className = 'fas fa-pause';
            mainStatusText.textContent = "يتم التشغيل الآن";
            errorMsg.style.display = 'none';
            
            let metaTitle = mainStationName.textContent;
            let metaArtist = 'Esma3 Fm';
            
            if (isPodcastPlaying) {
                metaTitle = episodeNameEl.textContent;
                metaArtist = mainStationName.textContent;
            }
            
            updateMediaSessionMetadata(metaTitle, metaArtist);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        }

        function handleError() {
            playIcon.className = 'fas fa-play';
            mainStatusText.textContent = "فشل التشغيل";
            errorMsg.style.display = 'block';
            if (currentPlayingCard) currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
        }

        function togglePlay() {
            if (!audioPlayer.src && !hlsInstance) {
                openSidebar();
                return; 
            }
            
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = 'fas fa-pause';
                mainStatusText.textContent = "يتم التشغيل الآن";
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            } else {
                audioPlayer.pause();
                playIcon.className = 'fas fa-play';
                mainStatusText.textContent = "متوقف مؤقتاً";
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            }
        }

        }

        function playNextPodcastEpisode() {
            if (currentPodcastHistoryIndex < podcastHistory.length - 1) {
                currentPodcastHistoryIndex++;
                const ep = podcastHistory[currentPodcastHistoryIndex];
                playStation(radioData[currentCategory][currentStationIndex], document.querySelectorAll('.station-card')[currentStationIndex], ep);
            } else {
                // التحديث الجديد: التعرف على جميع الإذاعات الجديدة لجلب الحلقة القادمة
                const currentStationName = radioData[currentCategory][currentStationIndex].name;
                const activeEpisodesList = currentStationName === "رحلة في الذاكرة" ? memoryJourneyEpisodes : 
                                           (currentStationName === "الدحيح" ? daheehEpisodes : 
                                           (currentStationName === "الشيخ محمد سعيد البوطي" ? boutiEpisodes : 
                                           (currentStationName === "هيثم الدخين" ? quranHaithamEpisodes : 
                                           (currentStationName === "رعد الكردي" ? quranRaadEpisodes : quranKahfEpisodes))));
                
                if (activeEpisodesList && activeEpisodesList.length > 0) {
                    const randomEp = activeEpisodesList[Math.floor(Math.random() * activeEpisodesList.length)];
                    podcastHistory.push(randomEp);
                    currentPodcastHistoryIndex = podcastHistory.length - 1;
                    playStation(radioData[currentCategory][currentStationIndex], document.querySelectorAll('.station-card')[currentStationIndex], randomEp);
                } else {
                    showToast("حدث خطأ في تحميل الحلقات");
                }
            }
        }

        function playPrevPodcastEpisode() {
            if (currentPodcastHistoryIndex > 0) {
                currentPodcastHistoryIndex--;
                const ep = podcastHistory[currentPodcastHistoryIndex];
                playStation(radioData[currentCategory][currentStationIndex], document.querySelectorAll('.station-card')[currentStationIndex], ep);
            } else {
                showToast("لا توجد حلقات سابقة في السجل للرجوع إليها");
            }
        }

        function playNextStationCategory() {
            const stations = radioData[currentCategory];
            if (!stations) return;
            let nextIndex = currentStationIndex + 1;
            if (nextIndex >= stations.length) nextIndex = 0;
            const cards = document.querySelectorAll('.station-card');
            if (cards[nextIndex]) {
                currentStationIndex = nextIndex;
                cards[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                playStation(stations[nextIndex], cards[nextIndex]);
            }
        }

        function playPrevStationCategory() {
            const stations = radioData[currentCategory];
            if (!stations) return;
            let prevIndex = currentStationIndex - 1;
            if (prevIndex < 0) prevIndex = stations.length - 1;
            if (currentStationIndex === -1) prevIndex = stations.length - 1;
            const cards = document.querySelectorAll('.station-card');
            if (cards[prevIndex]) {
                currentStationIndex = prevIndex;
                cards[prevIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                playStation(stations[prevIndex], cards[prevIndex]);
            }
        }

        function stopRadio() {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            audioPlayer.pause();
            audioPlayer.removeAttribute('src'); 
            audioPlayer.load(); 

            playIcon.className = 'fas fa-play';
            mainStationName.textContent = 'Esma3 Fm';
            episodeNameEl.style.display = 'none';
            isPodcastPlaying = false;
            
            mainStatusText.textContent = 'تم إيقاف التشغيل (توفير البيانات)';
            errorMsg.style.display = 'none';

            if (currentPlayingCard) {
                currentPlayingCard.classList.remove('playing');
                currentPlayingCard.querySelector('.play-icon').className = 'fas fa-play play-icon';
                currentPlayingCard = null;
            }

            if (sleepTimerId) {
                clearTimeout(sleepTimerId);
                sleepTimerId = null;
                document.getElementById('sleepBtn').classList.remove('active-sleep');
                document.getElementById('sleepBadge').style.display = 'none';
            }

            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
        }

        function toggleMute() {
            audioPlayer.muted = !audioPlayer.muted;
            document.getElementById('muteIcon').className = audioPlayer.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
        }

        function toggleFullScreen() {
            const playerElement = document.getElementById('mainBg');
            const expandIcon = document.getElementById('expandIcon');
            if (!document.fullscreenElement) {
                if (playerElement.requestFullscreen) playerElement.requestFullscreen();
                else if (playerElement.webkitRequestFullscreen) playerElement.webkitRequestFullscreen();
                else if (playerElement.msRequestFullscreen) playerElement.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const expandIcon = document.getElementById('expandIcon');
            expandIcon.className = !document.fullscreenElement ? 'fas fa-expand' : 'fas fa-compress';
        });

        function toggleSleepMenu() {
            document.getElementById('sleepMenu').classList.toggle('show');
        }

        function setSleepTimer(minutes) {
            document.getElementById('sleepMenu').classList.remove('show');
            const sleepBtn = document.getElementById('sleepBtn');
            const sleepBadge = document.getElementById('sleepBadge');
            
            if (sleepTimerId) { clearTimeout(sleepTimerId); sleepTimerId = null; }

            if (minutes === 0) {
                sleepBtn.classList.remove('active-sleep');
                sleepBadge.style.display = 'none';
                sleepBadge.textContent = '';
                return;
            }

            sleepBtn.classList.add('active-sleep');
            sleepBadge.textContent = minutes;
            sleepBadge.style.display = 'block';
            
            const ms = minutes * 60 * 1000;
            sleepTimerId = setTimeout(() => { stopRadio(); }, ms);
        }

        window.addEventListener('click', function(e) {
            if (!document.querySelector('.sleep-timer-container').contains(e.target)) {
                document.getElementById('sleepMenu').classList.remove('show');
            }
        });

        function minimizePlayer() {
            showToast("الراديو يدعم التشغيل في الخلفية، فقط اضغط على زر الرئيسية في هاتفك وسيستمر الصوت.");
        }

        audioPlayer.addEventListener('ended', function() {
            if (isPodcastPlaying) {
                playNextPodcastEpisode();
            } else {
                playNextStationCategory();
            }
        });

        audioPlayer.addEventListener('error', handleError);

        // ================== إضافة حفظ مكان البودكاست (للموبايل) ==================
        audioPlayer.addEventListener('timeupdate', () => {
            if (isPodcastPlaying && audioPlayer.currentTime > 5) {
                localStorage.setItem('esma3_mob_time_' + episodeNameEl.textContent, audioPlayer.currentTime);
            }
        });

        audioPlayer.addEventListener('canplay', () => {
            if (isPodcastPlaying) {
                const savedTime = localStorage.getItem('esma3_mob_time_' + episodeNameEl.textContent);
                if (savedTime && audioPlayer.currentTime < 2) {
                    audioPlayer.currentTime = parseFloat(savedTime);
                }
            }
        });

        audioPlayer.addEventListener('ended', () => {
            if (isPodcastPlaying) {
                localStorage.removeItem('esma3_mob_time_' + episodeNameEl.textContent);
            }
        });
        // =========================================================================
        
        // ================== إضافة قراءة الذاكرة المؤقتة للـ Refresh ==================
        window.onload = function() {
            initDropdown();
            
            if (localStorage.getItem('esma3_mob_triggerPlay') === '1') {
                localStorage.removeItem('esma3_mob_triggerPlay');
                
                const savedCat = localStorage.getItem('esma3_mob_cat');
                const savedIdx = parseInt(localStorage.getItem('esma3_mob_idx'));
                const savedHist = JSON.parse(localStorage.getItem('esma3_mob_hist') || '[]');
                const savedHistIdx = parseInt(localStorage.getItem('esma3_mob_hist_idx'));
                const savedEp = localStorage.getItem('esma3_mob_ep') ? JSON.parse(localStorage.getItem('esma3_mob_ep')) : null;

                if (savedCat && !isNaN(savedIdx)) {
                    categorySelect.value = savedCat;
                    loadCategory(savedCat);
                    
                    podcastHistory = savedHist;
                    currentPodcastHistoryIndex = isNaN(savedHistIdx) ? -1 : savedHistIdx;
                    window.isRecoveringState = true;
                    
                    const stations = radioData[savedCat];
                    if (stations && stations[savedIdx]) {
                        currentStationIndex = savedIdx;
                        const allCards = document.querySelectorAll('.station-card');
                        const card = allCards[savedIdx] || null;
                        
                        playStation(stations[savedIdx], card, savedEp); 
                    }
                }
            }
        };
        // =============================================================================
    </script>
</body>
</html>
